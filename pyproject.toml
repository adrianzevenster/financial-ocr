[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finextract"
version = "0.1.0"
description = "Financial document extraction and SharePoint reclassification pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # PDF and OCR
    "pymupdf>=1.24.0",
    "ocrmypdf>=16.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    # Config and validation
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    # Logging
    "structlog>=23.0.0",
    # HTTP and auth (SharePoint/Graph)
    "httpx>=0.27.0",
    "msal>=1.28.0",
    # Date parsing
    "python-dateutil>=2.9.0",
    # MIME detection
    "python-magic>=0.4.27",
    # API server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-python-dateutil",
]

[project.scripts]
finextract = "finextract.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/finextract"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finextract --cov-report=term-missing -v"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
